  # ---- Small caps -------------------------------------------------------
  - ticker: HOMEFIRST
    name: Home First Finance
    sector: Housing finance
    size: small
    why: Results AND a new CFO in the same filing on 27 Oct; best single demo

  - ticker: NAZARA
    name: Nazara Technologies
    sector: Gaming
    size: small
    why: CFO change 12 Oct plus a preferential equity raise; fund_raise + management_change

  - ticker: NETWEB
    name: Netweb Technologies India
    sector: IT hardware
    size: small
    why: Results 24 Oct with very large YoY growth; tests extreme numbers on the card

# Pull side: on-demand research demo set. Chosen because management gives
# explicit numeric targets on earnings calls, which is what
# "promised vs. delivered" needs. Outside the portfolio on purpose.
research:
  - ticker: PERSISTENT
    name: Persistent Systems
    sector: IT services
    why: Long-standing explicit revenue and margin targets

  - ticker: BAJFINANCE
    name: Bajaj Finance
    sector: NBFC
    why: Quarterly guidance on AUM growth and credit cost

  - ticker: DIXON
    name: Dixon Technologies
    sector: Electronics manufacturing
    why: Volume and revenue guidance by segment; fast-changing story

  - ticker: KAYNES
    name: Kaynes Technology India
    sector: Electronics manufacturing
    why: Aggressive growth targets; a real test of narrative vs. numbers

# Defaults for the settings table. The settings screen edits these later.
alerts:
  volume_multiple: 2.0        # volume >= 2x its 20-day average
  volume_lookback_days: 20
  price_move_pct: 5.0         # close-to-close move beyond +/-5%
  digest_window_hours: 24
  alert_categories:           # filing categories that trigger an alert
    - results
    - M&A
    - management_change
    - fund_raise
    - litigation
    - credit_rating
    - pledging

# Model routing. Check the current model ids in AI Studio before phase 2.
models:
  bulk: gemini-flash-lite-latest   # classify, summarise, extract
  reasoning: gemini-flash-latest   # results cross-check, research
