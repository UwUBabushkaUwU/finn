name: Research Engine

on:
  schedule:
    - cron: '30,40,50 3 * * *'
    - cron: '*/10 4-16 * * *'
    - cron: '0,10,20,30 17 * * *'
  workflow_dispatch:
    inputs:
      ticker:
        description: 'NSE Ticker Symbol (e.g. ASIANPAINT). Leave blank to process pending queue.'
        required: false
        type: string

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run research pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.ticker }}" ]; then
            python -m research.run --ticker "${{ github.event.inputs.ticker }}"
          else
            python -m research.run --pending
          fi

